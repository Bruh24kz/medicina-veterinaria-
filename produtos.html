<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos | Clínica Veterinária VetCare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0d9488;
            --primary-dark: #0f766e;
            --primary-light: #ccfbf1;
            --accent: #f59e0b;
            --bg: #f0fdfa;
            --card: #ffffff;
            --text: #134e4a;
            --muted: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
            --shadow: 0 10px 30px rgba(13, 148, 136, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        /* ========== NAVBAR ========== */
        .navbar {
            background: white;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0.9rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .nav-links {
            display: flex;
            gap: 1.8rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text);
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary);
        }

        .btn-nav {
            background: var(--primary);
            color: white !important;
            padding: 0.55rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-nav:hover {
            background: var(--primary-dark);
        }

        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text);
        }

        /* ========== HERO ========== */
        .hero {
            background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
            color: white;
            padding: 3.5rem 1.5rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .hero p {
            opacity: 0.95;
            font-size: 1.1rem;
        }

        /* ========== FILTROS ========== */
        .filtros {
            max-width: 1100px;
            margin: 2rem auto 0;
            padding: 0 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            justify-content: center;
        }

        .filtro-btn {
            padding: 0.55rem 1.2rem;
            border: 1.8px solid var(--border);
            border-radius: 30px;
            background: white;
            color: var(--text);
            font-weight: 500;
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filtro-btn:hover,
        .filtro-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* ========== PRODUTOS ========== */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        .produtos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.6rem;
        }

        .produto-card {
            background: var(--card);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.25s;
            display: flex;
            flex-direction: column;
            border: 1.5px solid transparent;
        }

        .produto-card:hover {
            transform: translateY(-6px);
            border-color: var(--primary);
            box-shadow: 0 15px 35px rgba(13, 148, 136, 0.15);
        }

        .produto-img {
            height: 160px;
            background: linear-gradient(135deg, #ccfbf1, #99f6e4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
        }

        .produto-info {
            padding: 1.3rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .produto-categoria {
            font-size: 0.78rem;
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
        }

        .produto-info h3 {
            font-size: 1.1rem;
            margin-bottom: 0.4rem;
            color: var(--text);
        }

        .produto-info p {
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 1rem;
            flex: 1;
        }

        .produto-preco {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .btn-comprar {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.7rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .btn-comprar:hover {
            background: var(--primary-dark);
        }

        /* ========== CARRINHO FLUTUANTE ========== */
        .carrinho-float {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--primary);
            color: white;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 6px 20px rgba(13, 148, 136, 0.4);
            cursor: pointer;
            z-index: 100;
            transition: transform 0.2s;
        }

        .carrinho-float:hover {
            transform: scale(1.08);
        }

        .carrinho-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--accent);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ========== FOOTER ========== */
        footer {
            background: #134e4a;
            color: white;
            padding: 3rem 1.5rem 1.5rem;
        }

        .footer-container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 2.5rem;
            margin-bottom: 2rem;
        }

        .footer-brand h3 {
            font-size: 1.3rem;
            margin-bottom: 0.8rem;
        }

        .footer-brand p {
            opacity: 0.85;
            font-size: 0.95rem;
        }

        .footer-links h4 {
            margin-bottom: 1rem;
            font-size: 1.05rem;
        }

        .footer-links ul {
            list-style: none;
        }

        .footer-links a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: white;
        }

        .footer-bottom {
            text-align: center;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255,255,255,0.15);
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* ========== RESPONSIVO ========== */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: white;
                flex-direction: column;
                padding: 1.5rem;
                gap: 1rem;
                box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            }

            .nav-links.show {
                display: flex;
            }

            .menu-toggle {
                display: block;
            }

            .hero h1 {
                font-size: 1.7rem;
            }

            .produtos-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            .footer-container {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
        }
    </style>
</head>
