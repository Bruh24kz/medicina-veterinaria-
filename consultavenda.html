<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta & Venda | Clínica Veterinária</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0d9488;
            --primary-dark: #0f766e;
            --primary-light: #ccfbf1;
            --accent: #f59e0b;
            --bg: #f0fdfa;
            --card: #ffffff;
            --text: #134e4a;
            --muted: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
            --shadow: 0 10px 30px rgba(13, 148, 136, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
            color: white;
            padding: 2.5rem 1.5rem 3.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: "🐾";
            position: absolute;
            font-size: 9rem;
            opacity: 0.07;
            right: 8%;
            top: -25px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }

        header p {
            opacity: 0.95;
            font-size: 1.1rem;
        }

        /* Navegação de abas */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin: -1.8rem auto 2rem;
            max-width: 500px;
            padding: 0 1.2rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.9rem 1.2rem;
            border: none;
            border-radius: 12px;
            background: white;
            color: var(--text);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            transform: translateY(-3px);
        }

        .tab-btn:hover:not(.active) {
            background: var(--primary-light);
        }

        /* Container */
        .container {
            max-width: 900px;
            margin: 0 auto 3rem;
            padding: 0 1.2rem;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2.2rem;
            display: none;
        }

        .card.active {
            display: block;
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--primary);
            margin: 1.6rem 0 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 0.4rem;
        }

        .section-title:first-child {
            margin-top: 0;
        }

        /* Formulário */
        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.35rem;
            font-size: 0.93rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.8px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 85px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .horarios {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.4rem;
        }

        .horario-btn {
            padding: 0.45rem 0.95rem;
            border: 1.8px solid var(--border);
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
