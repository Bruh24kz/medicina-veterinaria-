<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver Agendamentos | VetCare</title>
  <style>
    :root {
      --primary: #0d9488;
      --primary-hover: #0f766e;
      --bg: #f0fdfa;
      --card: #fff;
      --text: #134e4a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; background: var(--card); padding: 28px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
    h1 { color: var(--primary); font-size: 1.7rem; }
    a.voltar { color: var(--primary); text-decoration: none; font-weight: 600; }
    .filters { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    .filters input, .filters select {
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none;
    }
    .filters input[type="text"] { flex: 1; min-width: 180px; }
    .btn { padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-ok { background: #059669; color: #fff; }
    .btn-cancel { background: #dc2626; color: #fff; }
    .btn-ghost { background: #e2e8f0; color: var(--text); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); text-align: left; font-size: 0.95rem; }
    th { background: #f8fafc; color: #555; font-weight: 600; }
    tr:hover { background: #f9fafb; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; text-transform: capitalize; display: inline-block; }
    .badge-pendente { background: #fef3c7; color: #d97706; }
    .badge-confirmado { background: #d1fae5; color: #059669; }
    .badge-cancelado { background: #fee2e2; color: #dc2626; }
    .badge-concluido { background: #e0e7ff; color: #4338ca; }
    .empty, .loading, .error { text-align: center; padding: 2.5rem; color: var(--muted); }
    .error { color: #dc2626; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .table-wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🐾 Agendamentos - VetCare</h1>
      <div style="display:flex;gap:12px;align-items:center;">
        <a href="agendamentos.html" class="voltar">+ Novo</a>
        <a href="index.html" class="voltar">← Início</a>
      </div>
    </header>

    <div class="filters">
      <input type="text" id="busca" placeholder="Buscar tutor, pet ou telefone...">
      <input type="date" id="filtroData">
      <select id="filtroStatus">
        <option value="">Todos os status</option>
        <option value="pendente">Pendente</option>
        <option value="confirmado">Confirmado</option>
        <option value="cancelado">Cancelado</option>
        <option value="concluido">Concluído</option>
      </select>
      <button class="btn btn-primary" type="button" onclick="carregar()">Filtrar</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Horário</th>
            <th>Pet</th>
            <th>Tutor</th>
            <th>Serviço</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="7" class="loading">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    function badgeClass(status) {
      const s = (status || 'pendente').toLowerCase();
      if (s === 'confirmado') return 'badge-confirmado';
      if (s === 'cancelado') return 'badge-cancelado';
      if (s === 'concluido') return 'badge-concluido';
      return 'badge-pendente';
    }

    async function carregar() {
      const busca = document.getElementById('busca').value.trim();
      const data = document.getElementById('filtroData').value;
      const status = document.getElementById('filtroStatus').value;
      const params = new URLSearchParams();
      if (busca) params.set('busca', busca);
      if (data) params.set('data', data);
      if (status) params.set('status', status);

      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '<tr><td colspan="7" class="loading">Carregando...</td></tr>';

      try {
        const resp = await fetch('/api/agendamentos?' + params.toString());
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const rows = await resp.json();

        if (!Array.isArray(rows) || rows.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="empty">Nenhum agendamento encontrado.</td></tr>';
          return;
        }

        tbody.innerHTML = rows.map(function (a) {
          const st = a.status || 'pendente';
          const label = st.charAt(0).toUpperCase() + st.slice(1);
          let acoes = '<button class="btn btn-ghost" type="button" onclick="detalhes(' + a.id + ')">Detalhes</button>';
          if (st === 'pendente') {
            acoes += ' <button class="btn btn-ok" type="button" onclick="alterarStatus(' + a.id + ',\'confirmado\')">Confirmar</button>';
          }
          if (st !== 'cancelado' && st !== 'concluido') {
            acoes += ' <button class="btn btn-cancel" type="button" onclick="alterarStatus(' + a.id + ',\'cancelado\')">Cancelar</button>';
          }
          return '<tr>' +
            '<td>' + (a.data || '-') + '</td>' +
            '<td><strong>' + (a.horario || '-') + '</strong></td>' +
            '<td>' + (a.nome_pet || '-') + ' (' + (a.especie || '-') + ')</td>' +
            '<td>' + (a.nome_tutor || '-') + '<br><small>' + (a.telefone || '') + '</small></td>' +
            '<td>' + (a.servico || '-') + '</td>' +
            '<td><span class="badge ' + badgeClass(st) + '">' + label + '</span></td>' +
            '<td><div class="actions">' + acoes + '</div></td>' +
            '</tr>';
        }).join('');
      } catch (err) {
        console.error(err);
        tbody.innerHTML = '<tr><td colspan="7" class="error">Erro ao carregar. Rode o servidor: <code>npm start</code> e acesse pela porta do Codespace.</td></tr>';
      }
    }

    async function alterarStatus(id, novo) {
      if (!confirm('Alterar status para "' + novo + '"?')) return;
      try {
        const resp = await fetch('/api/agendamentos/' + id + '/status', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: novo })
        });
        const r = await resp.json();
        if (!resp.ok) throw new Error(r.error || 'Erro');
        carregar();
      } catch (e) {
        alert(e.message || 'Erro ao atualizar');
      }
    }

    async function detalhes(id) {
      try {
        const resp = await fetch('/api/agendamentos/' + id);
        const a = await resp.json();
        if (!resp.ok) throw new Error(a.error || 'Erro');
        alert(
          'Agendamento #' + a.id + '\n\n' +
          'Tutor: ' + a.nome_tutor + '\nEmail: ' + a.email + '\nTel: ' + a.telefone + '\n\n' +
          'Pet: ' + a.nome_pet + ' (' + a.especie + ')\nRaça: ' + (a.raca || '-') +
          '\nIdade: ' + (a.idade || '-') + '\nPeso: ' + (a.peso || '-') + '\n\n' +
          'Serviço: ' + a.servico + '\nData: ' + a.data + ' às ' + a.horario +
          '\nStatus: ' + a.status + '\n\nObs: ' + (a.observacoes || '-')
        );
      } catch (e) {
        alert('Erro ao carregar detalhes');
      }
    }

    document.getElementById('busca').addEventListener('keyup', function (e) {
      if (e.key === 'Enter') carregar();
    });
    carregar();
  </script>
</body>
</html>
